<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fixture: two textareas</title>
  </head>
  <body>
    <form id="application" action="/submitted" method="post">
      <p id="question">Why do you want to work at Acme?</p>
      <textarea id="first" name="first" rows="4" cols="60" aria-label="First answer"></textarea>
      <textarea id="second" name="second" rows="4" cols="60" aria-label="Second answer"></textarea>
      <button id="submit" type="submit">Submit application</button>
    </form>
  </body>
</html>
